<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Phase 10 Master – Wertungsblatt</title>
<meta name="description" content="Digitales Wertungsblatt für Phase 10 Master">
<meta name="theme-color" content="#eef1f5" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBar">
<meta name="apple-mobile-web-app-title" content="Phase 10">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
(function(){try{var t=localStorage.getItem('phase10master.theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();
</script>
<style>
:root,[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f5; --bg-2:#e4e9ef; --surface:#ffffff; --surface-2:#f6f8fa;
  --ink:#1c2128; --muted:#667085; --line:#e4e8ee;
  --accent:#0d9488; --accent-2:#0f766e; --accent-soft:#ccfbf1; --on-accent:#fff;
  --ok:#059669; --rose:#dc2626; --rose-soft:#fee2e2;
  --win-bg:#ecfdf5; --win-ink:#047857;
  --shadow:0 10px 32px rgba(16,24,40,.08);
  --p0:#f43f5e; --p1:#f59e0b; --p2:#10b981; --p3:#3b82f6; --p4:#8b5cf6; --p5:#f97316;
  --kbd:#e8ecf1; --kbd-key:#fff; --kbd-ink:#1c2128; --overlay:rgba(15,23,42,.4);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --lblw:42px; --colw:96px; --radius:16px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101318; --bg-2:#0c0e12; --surface:#1a1f27; --surface-2:#222830;
  --ink:#eef1f5; --muted:#9aa3ad; --line:#2c333d;
  --accent:#2dd4bf; --accent-2:#14b8a6; --accent-soft:#134e4a; --on-accent:#042f2e;
  --ok:#34d399; --rose:#fb7185; --rose-soft:#3f1d24;
  --win-bg:#134e4a; --win-ink:#5eead4;
  --shadow:0 10px 32px rgba(0,0,0,.45);
  --kbd:#12151a; --kbd-key:#2a3038; --kbd-ink:#eef1f5; --overlay:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;height:100svh;max-height:100svh;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  height:100%;max-height:100svh;overflow:hidden;display:flex;flex-direction:column;
  padding-left:var(--sal);padding-right:var(--sar)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

header.top{flex:none;background:var(--surface);color:var(--ink);
  padding:calc(var(--sat) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-left:calc(-1 * var(--sal));margin-right:calc(-1 * var(--sar));
  padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar));
  border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:.15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;font-weight:800;font-size:20px;color:var(--ink)}
.medal{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  border:0;font-size:12px;font-weight:800;color:var(--on-accent);background:var(--accent)}
.theme-btn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);
  font-size:13px;font-weight:700}
.theme-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

main{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  padding:10px 12px 8px;width:100%;margin:0 auto}
main.setup-main{display:block;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px calc(28px + var(--sab));max-width:560px}
h2{font-size:26px;font-weight:800;margin:4px 0 14px;color:var(--ink);letter-spacing:-.02em}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--surface)}
.seg button{flex:1;min-height:52px;background:transparent;border:0;border-right:1px solid var(--line);font-size:20px;font-weight:700;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.name-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;
  margin-bottom:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.name-btn .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.name-btn .v{font-size:18px;font-weight:800}
.name-btn .edit{font-size:13px;color:var(--accent-2);font-weight:700}

.btn{display:block;width:100%;min-height:54px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
  font-size:17px;font-weight:700;padding:10px 12px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.btn + .btn{margin-top:10px}
.btn:disabled{opacity:.38}
.hint{font-size:14px;color:var(--muted);margin:16px 2px 0;line-height:1.45}
.install{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid transparent;color:var(--ink);font-size:14px}

.win-overlay{position:fixed;inset:0;z-index:88;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(15,23,42,.42);-webkit-tap-highlight-color:transparent}
.win-card{width:min(420px,100%);border:0;border-radius:24px;background:var(--surface);color:var(--ink);
  padding:28px 24px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.win-kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.win-name{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px;line-height:1.15}
.win-card small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.win-hint{display:block;margin-top:18px;font-size:13px;font-weight:700;color:var(--muted)}

.sheet-card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
  background:var(--surface);border-radius:18px;padding:6px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet-wrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:12px}
table.sheet{border-collapse:separate;border-spacing:0;min-width:100%;width:100%;height:100%;table-layout:fixed;background:var(--surface)}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.sheet tr>*:last-child{border-right:0}
.sheet thead{position:sticky;top:0;z-index:4}
.sheet thead th,.sheet thead td{background:var(--surface)}
.sheet thead th.win{background:var(--win-bg)}
.sheet .lbl{position:sticky;left:0;z-index:2;background:var(--surface-2);width:var(--lblw);min-width:var(--lblw);max-width:var(--lblw);font-size:12px;font-weight:800;color:var(--muted);border-right:1px solid var(--line)}
.sheet thead .lbl{z-index:6}
.sheet .pc{min-width:var(--colw);width:var(--colw);container-type:inline-size}
.pname{display:block;width:100%;min-height:52px;border:0;background:transparent;padding:8px 6px 6px;text-align:left;font-size:14px;font-weight:800}
.pname .cnt{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
th.win .pname{background:var(--win-bg);color:var(--win-ink);border-radius:10px 10px 0 0}
th.win .pname .cnt{color:var(--win-ink)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 3px;padding:8px 6px;justify-items:center}
.ph{display:inline-flex;align-items:center;justify-content:center;pointer-events:none;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);
  font-size:11px;font-weight:800;padding:0;color:var(--muted);line-height:1}
@container (min-width: 150px){
  .ph{width:26px;height:26px;font-size:12px}
}
.ph[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ph.current{color:var(--accent-2);background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ph.locked{opacity:.38}
.sheet tbody td{height:44px;font-size:18px;font-variant-numeric:tabular-nums;font-weight:650}
.sheet tbody td.out{background:var(--win-bg);color:var(--win-ink);font-weight:800}
.sheet tbody td.out .star{display:inline-block;margin-right:4px;font-size:13px}
.sheet tbody tr.last td{font-weight:800}
.sheet tbody tr.fill{height:100%}
.sheet tbody tr.fill th,.sheet tbody tr.fill td{height:auto;min-height:28px;border-bottom:0}
.sheet tfoot{position:sticky;bottom:0;z-index:5}
.sheet tfoot th,.sheet tfoot td{background:var(--surface);border-top:2px solid var(--line);border-bottom:0;height:50px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.sheet tfoot .lbl{z-index:7;background:var(--surface-2)}
.empty td{color:transparent}
.col-0{box-shadow:inset 0 3px 0 var(--p0)}
.col-1{box-shadow:inset 0 3px 0 var(--p1)}
.col-2{box-shadow:inset 0 3px 0 var(--p2)}
.col-3{box-shadow:inset 0 3px 0 var(--p3)}
.col-4{box-shadow:inset 0 3px 0 var(--p4)}
.col-5{box-shadow:inset 0 3px 0 var(--p5)}

.bar{flex:none;position:relative;left:auto;right:auto;bottom:auto;width:auto;
  margin-left:calc(-1 * var(--sal));margin-right:calc(-1 * var(--sar));
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));z-index:10}
.bar .row{display:flex;gap:8px;margin-top:0}
.bar .row .btn{margin:0;flex:1;font-size:14px;min-height:48px;padding:6px 4px;line-height:1.15}

@media (max-height: 820px){
  header.top{padding-top:calc(var(--sat) + 8px);padding-bottom:8px}
  .brand{font-size:17px}
  .brand i{font-size:17px}
  .medal{width:24px;height:24px;font-size:11px}
  .bar{display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:8px;
    padding:8px calc(12px + var(--sar)) calc(8px + var(--sab)) calc(12px + var(--sal))}
  .bar .row{margin:0;flex:1 1 220px;min-width:0}
  .bar .row .btn{min-height:44px;min-width:0;font-size:15px}
}

.overlay{position:fixed;inset:0;height:100svh;max-height:100svh;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:calc(100svh - var(--sat) - 12px);overflow:hidden;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;padding:16px calc(16px + var(--sar)) 0 calc(16px + var(--sal));
  box-shadow:var(--shadow)}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:calc(12px + var(--sab))}
.modal h3{margin:0 0 6px;font-size:22px;font-weight:800;flex:none;letter-spacing:-.02em}
.modal p{margin:0 0 12px;color:var(--muted);font-size:14px;flex:none}
.round-list{flex:1;min-height:0;overflow-y:auto}
.modal-actions{flex:none;padding-top:8px}
.modal-actions .btn{min-height:48px}
.pblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.pblock .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.pblock .head b{font-size:17px}
.pblock .head span{font-size:12px;color:var(--muted);text-align:right;max-width:58%}
.prow{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px}
.prow .head{flex:1;min-width:0;margin:0;display:block}
.prow .head b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .head span{display:block;font-size:11px;text-align:left;max-width:none}
.prow .score-row{flex:none}
.prow .toggle{width:auto;margin:0;min-height:40px;padding:0 10px;font-size:13px;flex:none;white-space:nowrap}
.toggle.win[aria-checked="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.score-row{display:flex;align-items:center;gap:6px}
.step{width:44px;min-height:44px;border:0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:800}
.step:disabled{opacity:.3;cursor:default}
.score-face{min-width:48px;min-height:44px;padding:0 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.score-face.ro{background:var(--win-bg);color:var(--win-ink);border-color:var(--accent)}
.toggle{width:100%;min-height:48px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:800}
.toggle[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.err{color:var(--rose);font-weight:700;background:var(--rose-soft);border-radius:10px;padding:8px;margin-bottom:10px}

@media (max-height: 820px){
  .overlay{align-items:center;padding:8px}
  .modal{max-width:min(920px,100%);max-height:calc(100svh - 16px);border-radius:14px;padding:10px 12px 0}
  .modal-body{padding-bottom:calc(8px + var(--sab))}
  .modal h3{font-size:18px;margin:0 0 2px}
  .modal p{margin:0 0 8px;font-size:12px}
  .modal-actions{display:flex;gap:8px}
  .modal-actions .btn{margin:0;flex:1;min-height:42px;font-size:15px}
  .round-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
  .prow{margin:0}
}

.dock{flex:none;background:var(--kbd);margin:8px -16px 0;padding:12px 12px calc(12px + var(--sab));border-radius:16px 16px 0 0}
.pad{margin:0;padding:0;background:transparent}
.keys{display:flex;flex-direction:column;gap:6px}
.keys .row{display:flex;gap:5px;justify-content:center}
.keys button{flex:1;min-height:44px;border:0;border-radius:8px;background:var(--kbd-key);color:var(--kbd-ink);font-size:16px;font-weight:700;padding:0}
.keys button.fn{background:var(--surface-2);font-size:14px;color:var(--muted)}
.name-preview{min-height:56px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:22px;font-weight:800;margin-bottom:12px}

.update{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 8px);z-index:80;background:var(--accent);color:var(--on-accent);
  border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:800;
  box-shadow:var(--shadow)}
.update button{border:0;background:var(--on-accent);color:var(--accent-2);border-radius:10px;min-height:40px;padding:0 12px;font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:12px;font-weight:700;z-index:70;
  max-width:90%;text-align:center;font-size:15px;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:86;opacity:0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>Phase</i><span class="medal" aria-hidden="true">10</span><span>Master</span></div>
  <button type="button" class="theme-btn" id="btnTheme" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span class="theme-lbl">Dunkel</span></button>
</header>

<main id="app" aria-live="polite"></main>

<nav class="bar hidden" id="bar" aria-label="Aktionen">
  <div class="row">
    <button class="btn primary" id="btnRound" type="button">Runde eintragen</button>
    <button class="btn" id="btnEditLast" type="button">Runde korrigieren</button>
    <button class="btn" id="btnNew" type="button">Neues Spiel</button>
  </div>
</nav>

<div id="modalRoot"></div>
<div id="winRoot"></div>
<div id="updateRoot"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';
  var KEY = 'phase10master.state.v1';
  var HKEY = 'phase10master.history.v1';
  var THEME_KEY = 'phase10master.theme';
  var MAX_HIST = 100;
  var MIN_PLAYERS = 2;
  var MAX_PLAYERS = 6;
  var PHASES = [
    '4 Zwillinge',
    '6 Karten einer Farbe',
    '1 Vierling + 1 Viererfolge',
    '1 Achterfolge',
    '7 Karten einer Farbe',
    '1 Neunerfolge',
    '2 Vierlinge',
    '1 Viererfolge einer Farbe + 1 Drilling',
    '1 Fünfling + 1 Drilling',
    '1 Fünfling + 1 Dreierfolge einer Farbe'
  ];
  var LETTERS = [
    'qwertzuiopü',
    'asdfghjklöä',
    'yxcvbnmß'
  ];
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var modalRoot = document.getElementById('modalRoot');

  function emptyPhases() { return [false,false,false,false,false,false,false,false,false,false]; }
  function defaultNames() { return ['Spieler 1','Spieler 2','Spieler 3','Spieler 4','Spieler 5','Spieler 6']; }
  function defaultState() {
    return { v: 2, screen: 'setup', setupCount: 3, setupNames: defaultNames(), players: [], phases: [], rounds: [] };
  }
  var state = defaultState();
  var history = [];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(HKEY, JSON.stringify(history));
    } catch (e) { /* privater Modus */ }
  }
  function compactPhases(ph) {
    if (!Array.isArray(ph) || ph.length !== 10) return emptyPhases();
    var n = ph.filter(Boolean).length;
    return emptyPhases().map(function (_, i) { return i < n; });
  }
  function roundScores(r) { return Array.isArray(r) ? r : ((r && r.scores) || []); }
  function roundAdv(r, n) {
    var a = (!Array.isArray(r) && r && Array.isArray(r.advanced)) ? r.advanced.slice() : [];
    while (a.length < n) a.push(false);
    return a.slice(0, n);
  }
  function asRound(r, n) {
    var scores = roundScores(r).slice(0, n);
    var winner = -1;
    if (!Array.isArray(r) && r && typeof r.winner === 'number' && r.winner >= 0 && r.winner < n) winner = r.winner;
    else {
      var zeros = [];
      scores.forEach(function (s, i) { if (!s) zeros.push(i); });
      if (zeros.length === 1) winner = zeros[0];
    }
    return { scores: scores, advanced: roundAdv(r, n), winner: winner };
  }
  function valid(s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.players) || !Array.isArray(s.phases) || !Array.isArray(s.rounds)) return false;
    if (s.phases.length !== s.players.length) return false;
    var n = s.players.length;
    for (var i = 0; i < s.rounds.length; i++) {
      var sc = roundScores(s.rounds[i]);
      if (!Array.isArray(sc) || sc.length !== n) return false;
    }
    return true;
  }
  function migrate(s) {
    s = Object.assign(defaultState(), s);
    if (!Array.isArray(s.setupNames)) s.setupNames = defaultNames();
    while (s.setupNames.length < MAX_PLAYERS) s.setupNames.push('Spieler ' + (s.setupNames.length + 1));
    s.setupNames = s.setupNames.slice(0, MAX_PLAYERS);
    if (s.screen === 'setup') {
      s.setupCount = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, s.setupCount || 3));
    }
    s.phases = (s.phases || []).map(compactPhases);
    var n = (s.players && s.players.length) || 0;
    if (n) s.rounds = (s.rounds || []).map(function (r) { return asRound(r, n); });
    s.v = 2;
    return s;
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (valid(s)) state = migrate(s);
      var h = JSON.parse(localStorage.getItem(HKEY) || '[]');
      if (Array.isArray(h)) history = h.filter(function (x) { return x && valid(x.snap); }).map(function (x) {
        return { label: x.label, snap: migrate(x.snap) };
      });
    } catch (e) { state = defaultState(); history = []; }
    if (state.screen === 'game' && !state.players.length) state.screen = 'setup';
  }
  function commit(label, mutate) {
    history.push({ label: label, snap: clone(state) });
    if (history.length > MAX_HIST) history.shift();
    mutate();
    save();
    render();
  }
  function undo() {
    var h = history.pop();
    if (!h) return;
    state = migrate(h.snap);
    save();
    render();
    toast('Rückgängig: ' + h.label);
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function totals() {
    return state.players.map(function (_, i) {
      return state.rounds.reduce(function (a, r) { return a + (roundScores(r)[i] || 0); }, 0);
    });
  }
  function doneCount(i) { return state.phases[i].filter(Boolean).length; }
  function nextPhase(i) { return doneCount(i); }
  function winnerInfo() {
    var t = totals();
    var done = [];
    state.players.forEach(function (_, i) { if (doneCount(i) === 10) done.push(i); });
    if (!done.length) return null;
    var min = Math.min.apply(null, done.map(function (i) { return t[i]; }));
    var w = done.filter(function (i) { return t[i] === min; });
    return { winners: w, points: min, tie: w.length > 1 };
  }
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 1800);
  }
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  var fxRaf = 0;
  function celebrate() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.getElementById('fx');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = 0, H = 0;
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    var colors = ['#0d9488', '#2dd4bf', '#f59e0b', '#f43f5e', '#3b82f6', '#8b5cf6', '#f97316', '#fde68a'];
    var pieces = [];
    var sparks = [];
    function burst(x, y, n) {
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = 2 + Math.random() * 7;
        sparks.push({
          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          life: 1, color: colors[(Math.random() * colors.length) | 0], r: 1.4 + Math.random() * 2.2
        });
      }
    }
    for (var i = 0; i < 220; i++) {
      pieces.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7 - 40,
        w: 7 + Math.random() * 9,
        h: 9 + Math.random() * 11,
        vx: -1.6 + Math.random() * 3.2,
        vy: 2.6 + Math.random() * 3.8,
        rot: Math.random() * Math.PI,
        vr: -0.24 + Math.random() * 0.48,
        color: colors[(Math.random() * colors.length) | 0],
        circle: Math.random() < 0.32
      });
    }
    burst(W * 0.2, H * 0.28, 90);
    burst(W * 0.5, H * 0.18, 110);
    burst(W * 0.8, H * 0.3, 90);
    var start = performance.now();
    var duration = 5000;
    canvas.style.opacity = '1';
    cancelAnimationFrame(fxRaf);
    function tick(now) {
      var t = now - start;
      var fade = t > duration - 700 ? Math.max(0, (duration - t) / 700) : 1;
      ctx.clearRect(0, 0, W, H);
      if (t < 2800 && Math.random() < 0.08) {
        burst(W * (0.1 + Math.random() * 0.8), H * (0.08 + Math.random() * 0.38), 56);
      }
      for (var p = 0; p < pieces.length; p++) {
        var c = pieces[p];
        c.x += c.vx; c.y += c.vy; c.rot += c.vr;
        if (c.y > H + 24) { c.y = -24; c.x = Math.random() * W; }
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = fade;
        ctx.fillStyle = c.color;
        if (c.circle) { ctx.beginPath(); ctx.arc(0, 0, c.w / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
      for (var s = sparks.length - 1; s >= 0; s--) {
        var k = sparks[s];
        k.x += k.vx; k.y += k.vy; k.vy += 0.09; k.life -= 0.016;
        if (k.life <= 0) { sparks.splice(s, 1); continue; }
        ctx.globalAlpha = k.life * fade;
        ctx.fillStyle = k.color;
        ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (t < duration) fxRaf = requestAnimationFrame(tick);
      else { ctx.clearRect(0, 0, W, H); canvas.style.opacity = '0'; }
    }
    fxRaf = requestAnimationFrame(tick);
  }

  function render() {
    if (state.screen === 'setup') renderSetup(); else renderGame();
    paintWinnerCard();
  }

  function renderSetup() {
    bar.classList.add('hidden');
    app.className = 'setup-main';
    var n = state.setupCount;
    var h = '<h2>Neues Spiel</h2>';
    h += '<div class="field"><span id="cntLbl" class="hint" style="margin:0 0 8px;display:block">Anzahl Spieler</span></div>';
    h += '<div class="seg" role="group" aria-labelledby="cntLbl">';
    for (var k = MIN_PLAYERS; k <= MAX_PLAYERS; k++) {
      h += '<button type="button" data-count="' + k + '" aria-pressed="' + (k === n) + '" aria-label="' + k + ' Spieler">' + k + '</button>';
    }
    h += '</div>';
    for (var i = 0; i < n; i++) {
      h += '<button type="button" class="name-btn" data-editname="' + i + '"><span><span class="k">Spieler ' + (i + 1) + '</span><span class="v" style="display:block">' +
        esc(state.setupNames[i] || ('Spieler ' + (i + 1))) + '</span></span><span class="edit">Ändern</span></button>';
    }
    h += '<button class="btn primary" type="button" id="btnStart">Spiel starten</button>';
    if (history.length && state.players.length) {
      h += '<button class="btn" type="button" id="btnBackGame">Zurück zum letzten Spiel</button>';
    }
    if (!isStandalone()) {
      h += '<p class="install">Als App: im Browser <b>Teilen → Zum Home-Bildschirm</b> (iPad/iPhone) oder „App installieren“.</p>';
    }
    h += '<p class="hint">Phasen der Reihe nach. Wer zuerst alle 10 hat, gewinnt – bei mehreren die wenigsten Minuspunkte. Jede Restkarte zählt 1 Punkt.</p>';
    app.innerHTML = h;
  }

  function renderGame() {
    bar.classList.remove('hidden');
    app.className = '';
    var n = state.players.length;
    var t = totals();
    var w = winnerInfo();
    var h = '';
    var avail = Math.max(200, app.clientWidth - 28 - 8 - 42);
    var colw = Math.max(120, Math.floor(avail / n));
    h += '<div class="sheet-card"><div class="sheet-wrap" style="--colw:' + colw + 'px"><table class="sheet" aria-label="Wertungsblatt">';
    h += '<thead><tr><th class="lbl" scope="col"><span class="hidden">Runde</span></th>';
    for (var i = 0; i < n; i++) {
      var isWin = w && w.winners.indexOf(i) >= 0;
      var nxt = nextPhase(i);
      h += '<th class="pc col-' + i + (isWin ? ' win' : '') + '" scope="col"><button type="button" class="pname" data-rename="' + i + '" aria-label="' +
        esc(state.players[i]) + ', ' + doneCount(i) + ' von 10 Phasen. Namen ändern">' +
        esc(state.players[i]) + '<span class="cnt">' + (nxt >= 10 ? 'fertig' : 'Phase ' + (nxt + 1) + ': ' + PHASES[nxt]) + ' · ' + doneCount(i) + '/10</span></button></th>';
    }
    h += '</tr><tr><th class="lbl" scope="row" aria-label="Phasen">Ph.</th>';
    for (i = 0; i < n; i++) {
      h += '<td class="pc"><div class="pgrid">';
      for (var p = 0; p < 10; p++) h += phaseBtn(i, p);
      h += '</div></td>';
    }
    h += '</tr></thead><tbody>';
    var rows = state.rounds.length;
    for (var r = 0; r < rows; r++) {
      var rnd = asRound(state.rounds[r], n);
      h += '<tr' + (r === rows - 1 ? ' class="last"' : '') + '><th class="lbl" scope="row">' + (r + 1) + '</th>';
      for (i = 0; i < n; i++) {
        var isOut = rnd.winner === i;
        h += '<td' + (isOut ? ' class="out" title="Runde gewonnen"' : '') + '>' + (isOut ? '<span class="star" aria-hidden="true">★</span>' : '') + (rnd.scores[i] || 0) + '</td>';
      }
      h += '</tr>';
    }
    h += '<tr class="empty fill" aria-hidden="true"><th class="lbl"></th>';
    for (i = 0; i < n; i++) h += '<td></td>';
    h += '</tr>';
    h += '</tbody><tfoot><tr><th class="lbl" scope="row" aria-label="Summe">=</th>';
    for (i = 0; i < n; i++) h += '<td>' + t[i] + '</td>';
    h += '</tr></tfoot></table></div></div>';
    var oldWrap = app.querySelector('.sheet-wrap');
    var keepX = oldWrap ? oldWrap.scrollLeft : 0;
    app.innerHTML = h;
    if (keepX) app.querySelector('.sheet-wrap').scrollLeft = keepX;
    var ed = document.getElementById('btnEditLast');
    ed.disabled = !state.rounds.length;
    ed.setAttribute('aria-label', state.rounds.length ? 'Runde ' + state.rounds.length + ' korrigieren' : 'Runde korrigieren (noch keine Runde)');
    var roundBtn = document.getElementById('btnRound');
    var newBtn = document.getElementById('btnNew');
    var finished = !!w;
    roundBtn.disabled = finished;
    roundBtn.setAttribute('aria-label', finished ? 'Runde eintragen (Spiel beendet)' : 'Runde eintragen');
    roundBtn.classList.toggle('primary', !finished);
    newBtn.classList.toggle('primary', finished);
  }

  function paintWinnerCard() {
    var root = document.getElementById('winRoot');
    if (!root) return;
    var w = state.screen === 'game' ? winnerInfo() : null;
    if (!w) {
      if (state.winDismissed) { state.winDismissed = false; save(); }
      root.innerHTML = '';
      return;
    }
    if (state.winDismissed) { root.innerHTML = ''; return; }
    var names = w.winners.map(function (i) { return esc(state.players[i]); });
    var title = w.tie ? 'Gleichstand' : 'Gewinner';
    var who = w.tie ? names.join(' &amp; ') : names[0];
    root.innerHTML = '<div class="win-overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">' +
      '<button type="button" class="win-card" id="winCard">' +
      '<div class="win-kicker">' + title + '</div>' +
      '<div class="win-name" id="winTitle">' + who + '</div>' +
      '<small>alle 10 Phasen · ' + w.points + ' Minuspunkte</small>' +
      '<span class="win-hint">Tippen zum Schließen</span>' +
      '</button></div>';
  }
  function dismissWinnerCard() {
    if (!winnerInfo() || state.winDismissed) return;
    state.winDismissed = true;
    save();
    paintWinnerCard();
  }
  function phaseBtn(i, p) {
    var on = !!state.phases[i][p];
    var nxt = nextPhase(i);
    var current = !on && p === nxt;
    var locked = !on && p !== nxt;
    return '<span class="ph' + (current ? ' current' : '') + (locked ? ' locked' : '') + '" aria-pressed="' + on + '" title="' +
      esc(state.players[i] + ': Phase ' + (p + 1) + ' · ' + PHASES[p]) + '">' + (p + 1) + '</span>';
  }

  var lastFocus = null;
  function openModal(html, onReady, dock) {
    lastFocus = document.activeElement;
    modalRoot.innerHTML = '<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-body">' + html + '</div>' +
      (dock ? '<div class="dock">' + dock + '</div>' : '') + '</div></div>';
    document.body.style.overflow = 'hidden';
    var ov = document.getElementById('overlay');
    ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(); });
    if (onReady) onReady(ov.firstChild);
  }
  function closeModal() {
    modalRoot.innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalRoot.firstChild) closeModal(); });

  function setPhase(i, complete) {
    var d = doneCount(i);
    if (complete) {
      if (d >= 10) return false;
      state.phases[i][d] = true;
      return true;
    }
    if (d <= 0) return false;
    state.phases[i][d - 1] = false;
    return true;
  }

  function openRoundModal(editIndex) {
    var edit = typeof editIndex === 'number';
    if (!edit && winnerInfo()) return;
    var n = state.players.length;
    var prev = edit ? asRound(state.rounds[editIndex], n) : null;
    var pts = [];
    var adv = [];
    var winner = prev ? prev.winner : -1;
    for (var i = 0; i < n; i++) {
      pts[i] = prev ? (prev.scores[i] || 0) : 10;
      adv[i] = prev ? !!prev.advanced[i] : false;
    }
    if (winner >= 0) pts[winner] = 0;
    var h = '<h3 id="mTitle">' + (edit ? 'Runde ' + (editIndex + 1) : 'Runde ' + (state.rounds.length + 1)) + '</h3>';
    h += '<p>Eine Person „Aus“ (0 Punkte, Phase geschafft). Ohne Phase mindestens 10 Restkarten.</p>';
    h += '<div id="mErr" class="err hidden" role="alert"></div>';
    h += '<div class="round-list" role="radiogroup" aria-label="Wer hat ausgemacht">';
    for (i = 0; i < n; i++) {
      var d = doneCount(i);
      var was = adv[i];
      var phNo = was ? d : d + 1;
      var phTxt = (!was && d >= 10) ? 'fertig' : 'Phase ' + phNo;
      var canPh = was || d < 10;
      h += '<div class="pblock prow" data-block="' + i + '"><div class="head"><b>' + esc(state.players[i]) + '</b><span>' + esc(phTxt) + '</span></div>';
      h += '<div class="score-row"><button type="button" class="step" data-delta="-1" data-who="' + i + '" aria-label="Minuspunkte verringern für ' + esc(state.players[i]) + '">−</button>';
      h += '<div class="score-face" data-score="' + i + '">' + pts[i] + '</div>';
      h += '<button type="button" class="step" data-delta="1" data-who="' + i + '" aria-label="Minuspunkte erhöhen für ' + esc(state.players[i]) + '">+</button></div>';
      h += '<button type="button" class="toggle win" data-win="' + i + '" role="radio" aria-checked="' + (winner === i) + '">Aus</button>';
      if (canPh) {
        h += '<button type="button" class="toggle" data-adv="' + i + '" aria-pressed="' + was + '">Phase</button>';
      }
      h += '</div>';
    }
    h += '</div><div class="modal-actions">';
    h += '<button class="btn primary" type="button" id="mSave">Speichern</button>';
    if (edit) h += '<button class="btn danger" type="button" id="mDelete">Löschen</button>';
    h += '<button class="btn" type="button" id="mCancel">Abbrechen</button></div>';
    openModal(h, function (m) {
      function canPhNow(i) {
        var d = doneCount(i);
        return (prev && prev.advanced[i]) || d < 10;
      }
      function minPts(i) {
        if (i === winner) return 0;
        return adv[i] ? 0 : 10;
      }
      function maxPts(i) {
        return i === winner ? 0 : 20;
      }
      function clampPts(i) {
        pts[i] = Math.max(minPts(i), Math.min(maxPts(i), pts[i]));
      }
      function paint() {
        for (var pi = 0; pi < n; pi++) clampPts(pi);
        m.querySelectorAll('[data-score]').forEach(function (el) {
          var i = +el.getAttribute('data-score');
          el.textContent = String(pts[i]);
          el.classList.toggle('ro', i === winner);
        });
        m.querySelectorAll('[data-who]').forEach(function (b) {
          var i = +b.getAttribute('data-who');
          var next = pts[i] + (+b.getAttribute('data-delta'));
          b.disabled = next < minPts(i) || next > maxPts(i);
        });
        m.querySelectorAll('[data-win]').forEach(function (b) {
          b.setAttribute('aria-checked', String(+b.getAttribute('data-win') === winner));
        });
        m.querySelectorAll('[data-adv]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(!!adv[+b.getAttribute('data-adv')]));
        });
        var save = document.getElementById('mSave');
        if (save) save.disabled = winner < 0;
      }
      paint();
      m.addEventListener('click', function (e) {
        var t = e.target.closest('button');
        if (!t || t.disabled) return;
        if (t.hasAttribute('data-who')) {
          var who = +t.getAttribute('data-who');
          pts[who] += (+t.getAttribute('data-delta'));
          clampPts(who);
          paint(); return;
        }
        if (t.hasAttribute('data-win')) {
          var wi = +t.getAttribute('data-win');
          if (winner >= 0 && winner !== wi) {
            adv[winner] = false;
            pts[winner] = 10;
          }
          winner = wi;
          pts[winner] = 0;
          if (canPhNow(winner)) adv[winner] = true;
          paint(); return;
        }
        if (t.hasAttribute('data-adv')) {
          var ai = +t.getAttribute('data-adv');
          if (ai === winner) { adv[ai] = true; paint(); return; }
          adv[ai] = !adv[ai];
          clampPts(ai);
          paint(); return;
        }
        if (t.id === 'mCancel') closeModal();
        if (t.id === 'mDelete') {
          closeModal();
          commit('Runde ' + (editIndex + 1) + ' gelöscht', function () {
            asRound(state.rounds[editIndex], n).advanced.forEach(function (on, pi) { if (on) setPhase(pi, false); });
            state.rounds.splice(editIndex, 1);
          });
          toast('Runde gelöscht');
        }
        if (t.id === 'mSave') {
          if (winner < 0) {
            var er = document.getElementById('mErr');
            er.textContent = 'Speichern geht erst, wenn genau eine Person „Aus“ hat.';
            er.classList.remove('hidden');
            return;
          }
          pts[winner] = 0;
          if (canPhNow(winner)) adv[winner] = true;
          for (var si = 0; si < n; si++) {
            if (si === winner) continue;
            if (!adv[si] && pts[si] < 10) {
              var er2 = document.getElementById('mErr');
              er2.textContent = state.players[si] + ': ohne Phase mindestens 10 Punkte.';
              er2.classList.remove('hidden');
              return;
            }
          }
          closeModal();
          var hadWinner = !!winnerInfo();
          commit(edit ? 'Runde ' + (editIndex + 1) + ' korrigiert' : 'Runde ' + (state.rounds.length + 1) + ' eingetragen', function () {
            var rec = { scores: pts.slice(), advanced: adv.slice(), winner: winner };
            if (edit) {
              prev.advanced.forEach(function (wasOn, pi) {
                if (wasOn && !adv[pi]) setPhase(pi, false);
                if (!wasOn && adv[pi]) setPhase(pi, true);
              });
              state.rounds[editIndex] = rec;
            } else {
              state.rounds.push(rec);
              adv.forEach(function (on, pi) { if (on) setPhase(pi, true); });
            }
          });
          if (!hadWinner && winnerInfo()) celebrate();
        }
      });
    });
  }

  function openNameModal(kind, index) {
    var value = kind === 'setup' ? (state.setupNames[index] || '') : state.players[index];
    var caps = !value.length;
    var h = '<h3 id="mTitle">Name</h3><div class="name-preview" id="namePrev">' + esc(value) + '</div>';
    var dock = '<div class="pad"><div class="keys" id="keys"></div>';
    dock += '<div class="row" style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" id="nCancel" style="margin:0">Abbrechen</button>';
    dock += '<button type="button" class="btn primary" id="nOk" style="margin:0">Fertig</button></div></div>';
    openModal(h, function (m) {
      var prev = document.getElementById('namePrev');
      function drawKeys() {
        var html = '';
        LETTERS.forEach(function (row, ri) {
          html += '<div class="row">';
          if (ri === 2) html += '<button type="button" class="fn" data-k="shift">⇧</button>';
          for (var i = 0; i < row.length; i++) {
            var ch = row[i];
            var show = (caps && ch !== 'ß') ? ch.toUpperCase() : ch;
            html += '<button type="button" data-k="' + esc(show) + '">' + esc(show) + '</button>';
          }
          if (ri === 2) html += '<button type="button" class="fn" data-k="del">⌫</button>';
          html += '</div>';
        });
        html += '<div class="row"><button type="button" class="fn" data-k="space" style="flex:3">Leer</button></div>';
        document.getElementById('keys').innerHTML = html;
      }
      drawKeys();
      m.addEventListener('click', function (e) {
        var t = e.target.closest('button');
        if (!t) return;
        var k = t.getAttribute('data-k');
        if (k === 'shift') { caps = !caps; drawKeys(); return; }
        if (k === 'del') { value = value.slice(0, -1); caps = !value.length; prev.textContent = value; drawKeys(); return; }
        if (k === 'space') { if (value.length < 20) { value += ' '; caps = true; prev.textContent = value; drawKeys(); } return; }
        if (k && k.length === 1) {
          if (value.length < 20) { value += k; caps = false; prev.textContent = value; drawKeys(); }
          return;
        }
        if (t.id === 'nCancel') closeModal();
        if (t.id === 'nOk') {
          var nn = value.trim().slice(0, 20);
          if (!nn) nn = 'Spieler ' + (index + 1);
          closeModal();
          if (kind === 'setup') {
            state.setupNames[index] = nn; save(); render();
          } else if (nn !== state.players[index]) {
            commit('Umbenannt: ' + state.players[index] + ' → ' + nn, function () { state.players[index] = nn; });
          }
        }
      });
    }, dock);
  }

  function openNewGameModal() {
    var h = '<h3 id="mTitle">Neues Spiel?</h3><p>Punkte und Phasen des aktuellen Spiels werden zurückgesetzt.</p>';
    h += '<button class="btn primary" type="button" id="nSame">Gleiche Spieler</button>';
    h += '<button class="btn" type="button" id="nSetup">Spieler neu wählen</button>';
    h += '<button class="btn" type="button" id="nCancel">Abbrechen</button>';
    openModal(h, function (m) {
      m.addEventListener('click', function (e) {
        var id = e.target.id;
        if (id === 'nCancel') closeModal();
        if (id === 'nSame') {
          closeModal();
          commit('Neues Spiel', function () {
            state.rounds = [];
            state.phases = state.players.map(emptyPhases);
            state.winDismissed = false;
          });
          toast('Neues Spiel gestartet');
        }
        if (id === 'nSetup') {
          closeModal();
          commit('Neues Spiel (Spielerauswahl)', function () {
            state.setupCount = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, state.players.length || 3));
            state.players.forEach(function (p, i) { state.setupNames[i] = p; });
            state.screen = 'setup';
          });
        }
      });
    });
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-count')) {
      state.setupCount = +t.getAttribute('data-count');
      save(); render();
      return;
    }
    if (t.hasAttribute('data-editname')) {
      openNameModal('setup', +t.getAttribute('data-editname'));
      return;
    }
    if (t.id === 'btnStart') {
      var n = state.setupCount;
      commit('Spiel gestartet', function () {
        state.players = [];
        for (var i = 0; i < n; i++) {
          var nm = (state.setupNames[i] || '').trim() || ('Spieler ' + (i + 1));
          state.players.push(nm.slice(0, 20));
        }
        state.phases = state.players.map(emptyPhases);
        state.rounds = [];
        state.winDismissed = false;
        state.screen = 'game';
      });
      window.scrollTo(0, 0);
      return;
    }
    if (t.id === 'btnBackGame') { undo(); return; }
    if (t.hasAttribute('data-rename')) {
      openNameModal('player', +t.getAttribute('data-rename'));
    }
  });

  document.getElementById('btnRound').addEventListener('click', function () {
    if (this.disabled || winnerInfo()) return;
    openRoundModal();
  });
  document.getElementById('btnEditLast').addEventListener('click', function () {
    if (!state.rounds.length) return;
    openRoundModal(state.rounds.length - 1);
  });
  document.getElementById('btnNew').addEventListener('click', openNewGameModal);
  document.getElementById('winRoot').addEventListener('click', function () { dismissWinnerCard(); });

  var rt, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      if (state.screen === 'game' && !modalRoot.firstChild) render();
    }, 150);
  });

  function readTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'dark') return 'dark';
    } catch (e) { /* privater Modus */ }
    return 'light';
  }
  function applyTheme(theme) {
    var t = (theme === 'light' || theme === 'dark') ? theme : readTheme();
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#101318' : '#eef1f5');
    var barMeta = document.getElementById('statusBar');
    if (barMeta) barMeta.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
    var btn = document.getElementById('btnTheme');
    if (btn) {
      btn.setAttribute('aria-pressed', String(t === 'dark'));
      btn.setAttribute('aria-label', t === 'dark' ? 'Helles Design' : 'Dunkles Design');
      var lbl = btn.querySelector('.theme-lbl');
      if (lbl) lbl.textContent = t === 'dark' ? 'Hell' : 'Dunkel';
    }
  }
  document.getElementById('btnTheme').addEventListener('click', function () {
    var next = readTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* privater Modus */ }
    applyTheme(next);
  });
  window.__p10 = { get state() { return clone(state); }, get history() { return history.length; }, winnerInfo: winnerInfo, totals: totals, celebrate: celebrate };

  applyTheme();
  load();
  render();

  if ('serviceWorker' in navigator) {
    var swReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
        if (reg.waiting) reg.waiting.postMessage('skipWaiting');
        function check() { try { reg.update(); } catch (e) { /* Safari */ } }
        check();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      }).catch(function (err) { console.warn('SW-Registrierung fehlgeschlagen', err); });
    });
  }
})();
</script>
</body>
</html>
